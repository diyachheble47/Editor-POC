<!doctype html>
<div id="body3d"></div>
<script>
const S = T3.stage('#body3d', { height: 460 })
const R = S.root
const SKIN = 0xe3b497, BONE = 0xeee8d8
const skin = { layer: 'skin', opacity: 0.32, shell: true, name: 'Skin', info: 'The largest organ: a waterproof barrier that protects, senses touch and regulates temperature.' }
const bone = (n, i) => ({ layer: 'skeleton', name: n, info: i, rough: 0.45 })
const organ = (n, i, extra) => Object.assign({ layer: 'organs', name: n, info: i, rough: 0.4 }, extra)

// ---- skin: a translucent shell built from the same shapes as the body
T3.blob(R, [0.12, 0.14, 0.13], SKIN, Object.assign({ pos: [0, 1.62, 0] }, skin))                       // head
T3.limb(R, [0, 1.46, 0], [0, 1.38, 0], 0.055, SKIN, skin)                                                 // neck
T3.lathe(R, [[0.001, 0.92], [0.15, 0.96], [0.19, 1.1], [0.2, 1.25], [0.2, 1.34], [0.12, 1.4], [0.001, 1.41]], SKIN, Object.assign({ scale: [1.15, 1, 0.7] }, skin)) // torso
for (const s of [-1, 1]) {
  T3.limb(R, [s * 0.22, 1.34, 0], [s * 0.3, 1.08, 0], 0.052, SKIN, Object.assign({ r2: 0.043, knobs: 1 }, skin))   // upper arm
  T3.limb(R, [s * 0.3, 1.08, 0], [s * 0.33, 0.84, 0.05], 0.043, SKIN, Object.assign({ r2: 0.03, knobs: 1 }, skin)) // forearm
  T3.blob(R, [0.035, 0.055, 0.02], SKIN, Object.assign({ pos: [s * 0.335, 0.78, 0.055] }, skin))              // hand
  T3.limb(R, [s * 0.09, 0.93, 0], [s * 0.1, 0.5, 0.01], 0.085, SKIN, Object.assign({ r2: 0.055, knobs: 1 }, skin)) // thigh
  T3.limb(R, [s * 0.1, 0.5, 0.01], [s * 0.1, 0.1, 0], 0.055, SKIN, Object.assign({ r2: 0.038, knobs: 1 }, skin))   // shin
  T3.blob(R, [0.045, 0.03, 0.1], SKIN, Object.assign({ pos: [s * 0.1, 0.04, 0.05] }, skin))                   // foot
}

// ---- skeleton
T3.blob(R, [0.095, 0.11, 0.105], BONE, Object.assign({ pos: [0, 1.63, 0], noise: 0.02 }, bone('Skull', 'Protects the brain and shapes the face. 22 bones, fused except the jaw.')))
T3.blob(R, [0.065, 0.04, 0.07], BONE, Object.assign({ pos: [0, 1.53, 0.035] }, bone('Mandible', 'The jaw: the only skull bone that moves.')))
T3.tube(R, [[0, 1.46, -0.01], [0, 1.3, -0.04], [0, 1.15, -0.05], [0, 1.0, -0.03], [0, 0.93, -0.02]], 0.017, BONE, bone('Spine', '33 vertebrae that carry the body weight and protect the spinal cord.'))
for (let k = 0; k < 7; k++) {   // ribs: half-rings that get wider and then shorter
  const y = 1.32 - k * 0.04, w = 0.12 + Math.sin((k / 6) * Math.PI) * 0.06 + 0.02
  T3.part(R, new THREE.TorusGeometry(w, 0.008, 8, 28, Math.PI * 1.55), BONE, Object.assign({ pos: [0, y, -0.01], rot: [Math.PI / 2 + 0.12, 0, Math.PI * 0.725], scale: [1, 0.75, 1] }, bone('Rib cage', '12 pairs of ribs form a protective cage around the heart and lungs.')))
}
T3.limb(R, [0, 1.34, 0.085], [0, 1.15, 0.1], 0.012, BONE, bone('Sternum', 'The breastbone, where most ribs attach at the front.'))
T3.limb(R, [-0.13, 1.35, 0], [0.13, 1.35, 0], 0.012, BONE, Object.assign({ knobs: 1.2 }, bone('Clavicle', 'The collarbone: braces the shoulder. The most often broken bone.')))
T3.lathe(R, [[0.001, 0.86], [0.13, 0.9], [0.17, 0.97], [0.1, 1.0], [0.001, 1.0]], BONE, Object.assign({ scale: [1.2, 1, 0.55] }, bone('Pelvis', 'A bowl of bone that supports the spine and connects it to the legs.')))
for (const s of [-1, 1]) {
  T3.limb(R, [s * 0.22, 1.34, 0], [s * 0.3, 1.08, 0], 0.016, BONE, Object.assign({ r2: 0.013, knobs: 1.6 }, bone('Humerus', 'The upper arm bone, the long bone of the arm.')))
  T3.limb(R, [s * 0.3, 1.08, 0], [s * 0.33, 0.84, 0.05], 0.013, BONE, Object.assign({ r2: 0.009, knobs: 1.5 }, bone('Radius and ulna', 'Two parallel forearm bones that let the wrist rotate.')))
  T3.limb(R, [s * 0.09, 0.93, 0], [s * 0.1, 0.5, 0.01], 0.026, BONE, Object.assign({ r2: 0.02, knobs: 1.5 }, bone('Femur', 'The thigh bone: the longest and strongest bone in the body.')))
  T3.limb(R, [s * 0.1, 0.5, 0.01], [s * 0.1, 0.1, 0], 0.02, BONE, Object.assign({ r2: 0.014, knobs: 1.4 }, bone('Tibia', 'The shin bone: carries most of the weight below the knee.')))
  T3.blob(R, [0.025, 0.025, 0.02], BONE, Object.assign({ pos: [s * 0.1, 0.5, 0.03] }, bone('Patella', 'The kneecap: protects the knee joint.')))
}

// ---- organs
T3.blob(R, [0.085, 0.07, 0.095], 0xd98a9a, organ('Brain', 'Controls thought, memory, movement and every other organ. About 86 billion neurons.', { pos: [0, 1.66, 0], noise: 0.09, seed: 2 }))
T3.blob(R, [0.045, 0.055, 0.04], 0xc0392b, organ('Heart', 'A muscular pump: about 100,000 beats a day push blood round the body.', { pos: [0.03, 1.2, 0.04], rot: [0, 0, -0.5], noise: 0.04 }))
for (const s of [-1, 1]) T3.blob(R, [0.07, 0.115, 0.07], 0xe8a0a8, organ('Lungs', 'Swap oxygen into the blood and carbon dioxide out. About 300 million air sacs.', { pos: [s * 0.095, 1.22, -0.005], noise: 0.05, seed: s + 2 }))
T3.tube(R, [[0, 1.4, 0.0], [0, 1.3, 0.01], [0, 1.24, 0.01]], 0.011, 0xc9d6e2, organ('Trachea', 'The windpipe: carries air to the lungs.'))
T3.blob(R, [0.09, 0.05, 0.06], 0x8a3b2e, organ('Liver', 'Cleans the blood, makes bile and stores energy. It can regrow.', { pos: [-0.06, 1.06, 0.04], noise: 0.04 }))
T3.blob(R, [0.055, 0.04, 0.04], 0xd9777f, organ('Stomach', 'Breaks food down with acid and muscle churning.', { pos: [0.07, 1.06, 0.045], rot: [0, 0, 0.6], noise: 0.03 }))
for (const s of [-1, 1]) T3.blob(R, [0.025, 0.04, 0.02], 0x9b3d3d, organ('Kidneys', 'Filter about 180 litres of blood a day into urine.', { pos: [s * 0.07, 1.0, -0.06] }))
T3.tube(R, [[-0.08, 0.96, 0.05], [0.0, 0.94, 0.08], [0.08, 0.96, 0.05], [0.06, 0.99, 0.05], [-0.03, 1.0, 0.07], [-0.06, 1.02, 0.05]], 0.016, 0xe0a0a0, organ('Small intestine', 'About 6 metres of coiled tube where most nutrients are absorbed.'))
T3.tube(R, [[-0.12, 0.93, 0.03], [-0.12, 1.02, 0.03], [0, 1.04, 0.03], [0.12, 1.03, 0.03], [0.12, 0.93, 0.03]], 0.017, 0xc98a8a, organ('Large intestine', 'Absorbs water and forms waste. About 1.5 metres long.'))

S.ui({ layers: [{ id: 'skin', label: 'Skin', on: true }, { id: 'skeleton', label: 'Skeleton', on: true }, { id: 'organs', label: 'Organs', on: true }] })
</script>
